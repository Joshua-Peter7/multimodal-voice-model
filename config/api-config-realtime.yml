# API Configuration for Real-Time 6-Language Indian Translation System
# This file defines all service configurations, API endpoints, and language-specific settings
# IMPORTANT: Never commit actual API keys - all sensitive values use ${ENV_VAR:default} syntax

# ============ SYSTEM SETTINGS ============
system:
  name: "Multimodal Voice Cloning - Real-Time Indian Translation"
  version: "1.0.0"
  description: "Concurrent translation to 6 Indian languages: Tamil, English, Telugu, Malayalam, Kannada, Hindi"
  
  # Target Languages (Fixed 6 for real-time system)
  target_languages:
    - code: "ta"
      name: "Tamil"
      native: "தமிழ்"
      priority: 1
    - code: "en"
      name: "English"
      native: "English"
      priority: 2
    - code: "te"
      name: "Telugu"
      native: "తెలుగు"
      priority: 3
    - code: "ml"
      name: "Malayalam"
      native: "മലയാളം"
      priority: 4
    - code: "kn"
      name: "Kannada"
      native: "ಕನ್ನಡ"
      priority: 5
    - code: "hi"
      name: "Hindi"
      native: "हिंदी"
      priority: 6
  
  # Pipeline Configuration
  pipeline:
    concurrent_processing: true
    max_parallel_streams: 10
    timeout_total_ms: 30000
    enable_stream_tracing: true

# ============ STEP 1: SPEECH-TO-TEXT (ASR) ============
asr:
  service_name: "asr-service"
  port: "${ASR_PORT:5002}"
  provider: "sonix"
  description: "Sonix STT - Transcribe audio in any language"
  
  # Expected Processing Time
  performance:
    typical_latency_ms: 2500
    max_latency_ms: 5000
    
  sonix:
    enabled: true
    api_key: "${ASR_SONIX_API_KEY:}"
    workspace_token: "${ASR_SONIX_WORKSPACE_TOKEN:}"
    api_url: "https://api.sonix.ai/v1"
    timeout_ms: "${ASR_TIMEOUT_MS:8000}"
    max_retries: 2
    retry_backoff_ms: [100, 200]
    
    # Audio Settings
    audio:
      encoding: "linear16"
      sample_rate: 16000
      channels: 1
      chunk_size: 4096
    
    # Features
    features:
      interim_results: true
      confidence_scores: true
      speaker_detection: false
      punctuation: true
    
    # Language Detection
    language_detection:
      mode: "auto"
      confidence_threshold: 0.8
    
    # Fallback Providers
    fallback:
      - provider: "deepgram"
        api_key: "${ASR_DEEPGRAM_API_KEY:}"
        api_url: "https://api.deepgram.com/v1/listen"

# ============ STEP 2: TRANSLATION (LLM) ============
translation:
  service_name: "translation-service"
  port: "${TRANSLATION_PORT:5003}"
  provider: "llama"
  model: "${TRANSLATION_MODEL:llama-2-7b}"
  description: "Llama-based translation to 6 Indian languages (batch parallel)"
  
  # Expected Processing Time
  performance:
    typical_latency_ms: 3500
    max_latency_ms: 8000
    per_language_latency_ms: 500  # After first language processed
    
  # LLM Backends (choose primary, others as fallback)
  backends:
    - name: "anthropic"
      enabled: true
      priority: 1
      api_key: "${TRANSLATION_ANTHROPIC_API_KEY:}"
      api_url: "https://api.anthropic.com/v1/messages"
      model: "${TRANSLATION_ANTHROPIC_MODEL:claude-3-sonnet-20240229}"
      max_tokens: 1000
      temperature: 0.3
      description: "Claude 3 Sonnet - Best for quality translations"
      
    - name: "openai"
      enabled: false
      priority: 2
      api_key: "${TRANSLATION_OPENAI_API_KEY:}"
      api_url: "https://api.openai.com/v1/chat/completions"
      model: "${TRANSLATION_OPENAI_MODEL:gpt-4}"
      max_tokens: 1000
      temperature: 0.3
      description: "GPT-4 - Fallback high-quality option"
      
    - name: "huggingface"
      enabled: false
      priority: 3
      api_key: "${TRANSLATION_HUGGINGFACE_API_KEY:}"
      api_url: "https://api-inference.huggingface.co/models/meta-llama/Llama-2-7b-chat-hf"
      model: "meta-llama/Llama-2-7b-chat-hf"
      description: "HuggingFace Llama 2 - Local or remote"
  
  # Translation Settings
  configuration:
    timeout_ms: "${TRANSLATION_TIMEOUT_MS:10000}"
    max_retries: 2
    batch_mode: true
    parallel_requests: 6
    stream_id_tracking: true
    
    # Prompt Template
    prompt_template: |
      You are an expert translator specializing in Indian languages.
      Translate the following text to {{target_language}} while preserving context and meaning.
      
      Text to translate:
      {{text}}
      
      Provide ONLY the translation, no explanations.
  
  # Language-Specific Settings
  language_settings:
    ta:  # Tamil
      model_override: null
      context_window: 2000
      cultural_notes: true
    en:  # English
      model_override: null
      context_window: 2000
      cultural_notes: false
    te:  # Telugu
      model_override: null
      context_window: 2000
      cultural_notes: true
    ml:  # Malayalam
      model_override: null
      context_window: 2000
      cultural_notes: true
    kn:  # Kannada
      model_override: null
      context_window: 2000
      cultural_notes: true
    hi:  # Hindi
      model_override: null
      context_window: 2000
      cultural_notes: true
  
  # Context Caching (for conversation continuity)
  caching:
    enabled: true
    backend: "redis"
    ttl_seconds: 3600
    max_context_size_mb: 100

# ============ STEP 3: TEXT-TO-SPEECH (TTS) ============
tts:
  service_name: "tts-service"
  port: "${TTS_PORT:5005}"
  provider: "elevenlabs"
  description: "ElevenLabs - Generate realistic speech audio in 6 Indian languages"
  
  # Expected Processing Time
  performance:
    typical_latency_ms: 4000
    max_latency_ms: 10000
    per_language_latency_ms: 600  # Parallel per-language
  
  # ElevenLabs Configuration
  elevenlabs:
    enabled: true
    api_key: "${TTS_ELEVENLABS_API_KEY:}"
    api_url: "https://api.elevenlabs.io/v1"
    timeout_ms: "${TTS_TIMEOUT_MS:15000}"
    max_retries: 2
    
    # Voice IDs for Each Language
    voices:
      ta:
        voice_id: "${TTS_VOICE_TAMIL:}"
        name: "Priya"
        gender: "female"
        age: "30s"
      en:
        voice_id: "${TTS_VOICE_ENGLISH:}"
        name: "Aria"
        gender: "female"
        age: "30s"
      te:
        voice_id: "${TTS_VOICE_TELUGU:}"
        name: "Divya"
        gender: "female"
        age: "30s"
      ml:
        voice_id: "${TTS_VOICE_MALAYALAM:}"
        name: "Anitha"
        gender: "female"
        age: "30s"
      kn:
        voice_id: "${TTS_VOICE_KANNADA:}"
        name: "Aadhya"
        gender: "female"
        age: "30s"
      hi:
        voice_id: "${TTS_VOICE_HINDI:}"
        name: "Anjali"
        gender: "female"
        age: "30s"
    
    # Audio Settings
    audio:
      format: "mp3"
      bitrate: "128k"
      sample_rate: 24000
      stability: "${TTS_STABILITY:0.75}"
      similarity_boost: "${TTS_SIMILARITY_BOOST:0.75}"
    
    # Per-Language Settings
    language_settings:
      ta:
        speaking_rate: 0.95
        pitch_adjustment: 0.0
      en:
        speaking_rate: 1.0
        pitch_adjustment: 0.0
      te:
        speaking_rate: 0.95
        pitch_adjustment: 0.0
      ml:
        speaking_rate: 0.95
        pitch_adjustment: 0.0
      kn:
        speaking_rate: 0.95
        pitch_adjustment: 0.0
      hi:
        speaking_rate: 1.0
        pitch_adjustment: 0.0
    
    # Fallback Providers
    fallback:
      - provider: "google_cloud"
        api_key: "${TTS_GOOGLE_API_KEY:}"
        api_url: "https://texttospeech.googleapis.com/v1"
      - provider: "aws_polly"
        access_key: "${TTS_AWS_ACCESS_KEY:}"
        secret_key: "${TTS_AWS_SECRET_KEY:}"
        region: "us-east-1"

# ============ API GATEWAY ============
gateway:
  service_name: "api-gateway"
  port: "${GATEWAY_PORT:5000}"
  host: "${SERVER_HOST:localhost}"
  
  # CORS Configuration
  cors:
    allow_origins: "${CORS_ALLOW_ORIGINS:*}"
    allow_methods: ["GET", "POST", "OPTIONS"]
    allow_headers: ["*"]
  
  # Rate Limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    requests_per_second: 2
  
  # Request/Response Logging
  logging:
    log_request_body: true
    log_response_body: true
    log_headers: false
    sensitive_fields: ["api_key", "token", "password"]

# ============ REAL-TIME PIPELINE CONFIGURATION ============
pipeline:
  # Processing Order (sequential but steps are marked for parallel execution)
  stages:
    - stage: 1
      name: "Speech Capture"
      duration_ms: 3000
      description: "User speaks, audio captured"
    
    - stage: 2
      name: "ASR Transcription"
      service: "asr-service"
      timeout_ms: 5000
      parallelizable: false
      description: "Convert audio to text (language auto-detected)"
    
    - stage: 3
      name: "LLM Translation"
      service: "translation-service"
      timeout_ms: 8000
      parallelizable: true
      parallel_targets: 6
      description: "Translate text to all 6 Indian languages simultaneously"
    
    - stage: 4
      name: "TTS Synthesis"
      service: "tts-service"
      timeout_ms: 10000
      parallelizable: true
      parallel_targets: 6
      description: "Generate audio for all 6 languages simultaneously"
  
  # Total Expected Latency
  expected_latency:
    minimum_ms: 10000  # ~10 seconds
    typical_ms: 15000  # ~15 seconds
    maximum_ms: 30000  # ~30 seconds (with retries)
  
  # Stream Management
  streams:
    max_concurrent: "${MAX_CONCURRENT_STREAMS:10}"
    buffer_size_seconds: "${BUFFER_SIZE_SECONDS:5}"
    cleanup_idle_after_seconds: 300

# ============ HEALTH CHECKS ============
health_checks:
  enabled: true
  interval_seconds: 30
  services:
    - name: "asr-service"
      endpoint: "http://localhost:${ASR_PORT:5002}/api/v1/health"
      timeout_ms: 3000
    
    - name: "translation-service"
      endpoint: "http://localhost:${TRANSLATION_PORT:5003}/api/v1/health"
      timeout_ms: 3000
    
    - name: "tts-service"
      endpoint: "http://localhost:${TTS_PORT:5005}/api/v1/health"
      timeout_ms: 3000
    
    - name: "api-gateway"
      endpoint: "http://localhost:${GATEWAY_PORT:5000}/api/v1/health"
      timeout_ms: 3000

# ============ MONITORING & METRICS ============
monitoring:
  enabled: true
  prometheus_port: 9090
  
  metrics:
    - name: "pipeline_latency_ms"
      description: "Total pipeline processing time per stream"
      type: "histogram"
    
    - name: "stage_latency_ms"
      description: "Individual stage processing time"
      type: "histogram"
    
    - name: "error_rate"
      description: "Percentage of failed streams"
      type: "counter"
    
    - name: "active_streams"
      description: "Number of active processing streams"
      type: "gauge"
    
    - name: "api_calls_total"
      description: "Total API calls to external services"
      type: "counter"

# ============ LOGGING ============
logging:
  level: "${LOG_LEVEL:INFO}"
  format: "json"
  
  loggers:
    - name: "asr-service"
      level: "INFO"
    - name: "translation-service"
      level: "DEBUG"
    - name: "tts-service"
      level: "INFO"
    - name: "api-gateway"
      level: "INFO"
    - name: "pipeline"
      level: "DEBUG"
  
  # Request Tracing
  request_tracing:
    enabled: "${ENABLE_REQUEST_TRACING:true}"
    log_level: "DEBUG"
    include_headers: false
    include_body: true
    max_body_bytes: 1000
