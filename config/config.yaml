apis:
  elevenlabs:
    api_key: ${ELEVENLABS_API_KEY}
    model_id: eleven_turbo_v2_5
    optimize_streaming_latency: 4
    output_format: pcm_16000
    stream_chunk_size: 512
    use_websocket: true
    ws_url: wss://api.elevenlabs.io/v1/text-to-speech/{voice_id}/stream-input?model_id=eleven_turbo_v2_5&output_format=pcm_16000
  groq:
    api_key: ${GROQ_API_KEY}
    base_url: https://api.groq.com/openai/v1
    max_tokens: 512
    model_id: llama-3.3-70b-versatile
    temperature: 0.05
    timeout_seconds: 5
  soniox:
    api_key: ${SONIOX_API_KEY}
    include_nonfinal: true
    max_alternatives: 1
    model: stt-rt-v4
    num_audio_channels: 1
    sample_rate: 16000
audio:
  bit_depth: 16
  bypass_vad: true
  channels: 1
  chunk_duration_ms: 20
  noise_suppression:
    enabled: false
    intensity: 0.5
  sample_rate: 16000
  vad:
    aggressiveness: 2
    enabled: false
    energy_threshold: 0.005
    silence_threshold_ms: 300
    speech_threshold_ms: 100
languages:
- code: hi
  enabled: true
  name: Hindi
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_HI}
- code: te
  enabled: true
  name: Telugu
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_TE}
- code: ta
  enabled: true
  name: Tamil
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_TA}
- code: es
  enabled: true
  name: Spanish
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_ES}
- code: fr
  enabled: false
  name: French
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_FR}
- code: de
  enabled: false
  name: German
  similarity_boost: 0.75
  stability: 0.5
  voice_id: ${EL_VOICE_DE}
logging:
  format: json
  level: INFO
  log_latency: true
  log_transcripts: true
metrics:
  collect_interval_seconds: 10
  enabled: true
  prometheus_port: 9090
moderation:
  blocked_words: []
  enabled: true
  moderate_translations: true
  replacement_text: '***'
  severity_threshold: 0.7
  strategy: filter
pipeline:
  final_confirm_delay_ms: 10
  max_tts_concurrency: 12
  parallel_lang_processing: true
  partial_min_chars: 8
  retry_attempts: 1
  retry_delay_ms: 20
  speculative_interval_ms: 80
  speculative_translation: true
  stream_tts_chunks: true
  target_latency_ms: 60
redis:
  channel_prefix: lang_channel
  db: 0
  host: ${REDIS_HOST}
  max_connections: 20
  password: ${REDIS_PASSWORD}
  port: 6379
server:
  cors_origins:
  - '*'
  host: 0.0.0.0
  max_connections: 500
  ping_interval_seconds: 20
  ping_timeout_seconds: 10
  port: 8000
  ws_listener_path: /ws/listener
  ws_path: /ws
  ws_speaker_path: /ws/speaker
source:
  language_code: en
  language_name: English
