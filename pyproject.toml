[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-voice-cloning"
version = "1.0.0"
description = "Real-time Multi-Channel Speech Translation & Broadcast System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Team", email = "team@example.com" }
]
keywords = [
  "speech-recognition",
  "translation",
  "real-time",
  "microservices",
  "websocket",
  "streaming",
  "multi-language"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.104.1",
  "uvicorn>=0.24.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "redis>=5.0.1",
  "aioredis>=2.0.1",
]

[project.optional-dependencies]
asr = [
  "deepgram-sdk>=4.0.0",
  "openai>=1.3.9",
  "google-cloud-speech>=2.21.1",
  "librosa>=0.10.0",
  "soundfile>=0.12.1",
  "fasttext>=0.9.2",
]
translation = [
  "anthropic>=0.7.11",
  "google-generativeai>=0.3.0",
  "google-cloud-translate>=3.11.1",
  "tiktoken>=0.5.1",
]
tts = [
  "elevenlabs>=0.2.28",
  "google-cloud-texttospeech>=2.14.0",
  "boto3>=1.28.85",
  "pydub>=0.25.1",
]
moderation = [
  "google-cloud-language>=2.11.1",
  "presidio-analyzer>=2.2.354",
  "presidio-anonymizer>=2.2.354",
]
realtime = [
  "python-socketio>=5.10.0",
  "python-engineio>=4.8.0",
  "websockets>=12.0",
]
database = [
  "psycopg2-binary>=2.9.9",
  "sqlalchemy>=2.0.23",
  "alembic>=1.12.1",
]
security = [
  "python-jose>=3.3.0",
  "PyJWT>=2.8.1",
  "passlib>=1.7.4",
  "cryptography>=41.0.7",
  "bcrypt>=4.1.1",
]
monitoring = [
  "prometheus-client>=0.19.0",
  "python-json-logger>=2.0.7",
  "jaeger-client>=4.8.0",
  "opentelemetry-api>=1.21.0",
  "opentelemetry-sdk>=1.21.0",
  "opentelemetry-exporter-jaeger>=1.21.0",
]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "pytest-cov>=4.1.0",
  "black>=23.12.0",
  "flake8>=6.1.0",
  "mypy>=1.7.1",
  "pylint>=3.0.3",
  "isort>=5.13.2",
]
all = [
  "multimodal-voice-cloning[asr,translation,tts,moderation,realtime,database,security,monitoring,dev]",
]

[project.urls]
Homepage = "https://github.com/example/multimodal-voice-cloning"
Documentation = "https://multimodal-voice-cloning.readthedocs.io"
Repository = "https://github.com/example/multimodal-voice-cloning"
Issues = "https://github.com/example/multimodal-voice-cloning/issues"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["shared"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--strict-markers -v --tb=short"
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__init__.py",
  "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
