# ============================================================
# docker-compose.yml — Full stack: App + Redis
# Usage: docker compose up --build
# ============================================================

version: "3.9"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-net

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro   # Hot-mountable config
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-net:
    driver: bridge
